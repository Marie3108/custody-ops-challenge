services:
  mysql:
    image: mysql:8.0
    container_name: custody-ops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localRootPassword123!}
      MYSQL_DATABASE: custody_ops
      MYSQL_USER: custody_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localAppPassword123!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: custody_app
      DB_PASSWORD: ${MYSQL_PASSWORD:-localAppPassword123!}
      DB_NAME: custody_ops
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data: